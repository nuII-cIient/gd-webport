<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#000000" />

        <title>Geometry Dash</title>

        <style>
            html {
                background: #000;
            }

            body {
                margin: 0;
                height: 100%;
                color: #ddd;
                font-family: monospace;
                overflow: hidden;
                background: #000;
            }

            /* Full-screen stage that holds the canvas. */
            #stage {
                position: fixed;
                inset: 0;
                z-index: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                pointer-events: none;
            }

            /* The canvas fills the whole viewport. object-fit: contain keeps the
               16:9 aspect ratio and letterboxes with black bars. The input code
               below compensates for those bars. */
            canvas {
                width: 100%;
                height: 100%;
                max-width: none;
                max-height: none;
                object-fit: contain;
                background: #000;
                image-rendering: pixelated;
                outline: none;
                display: block;
                user-select: none;
                touch-action: none;
                pointer-events: auto;
            }

            /* Loading overlay: covers the canvas until the first frame renders. */
            #loading {
                position: fixed;
                inset: 0;
                z-index: 20;
                background: #000;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
                color: #888;
                font-family: monospace;
                font-size: 13px;
                letter-spacing: 2px;
                transition: opacity 0.45s ease;
            }

            #loading.hide {
                opacity: 0;
                pointer-events: none;
            }

            #loading .spinner {
                width: 38px;
                height: 38px;
                border: 3px solid #222;
                border-top-color: #ccc;
                border-radius: 50%;
                animation: gdspin 0.9s linear infinite;
            }

            @keyframes gdspin {
                to {
                    transform: rotate(360deg);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                #loading .spinner {
                    animation-duration: 2s;
                }
            }

            /* Debug console: hidden unless ?debug is present. */
            #console {
                position: fixed;
                left: 8px;
                right: 8px;
                bottom: 8px;
                z-index: 4;
                height: 18vh;
                min-height: 90px;
                max-height: 200px;
                padding: 6px 8px;
                overflow-y: auto;
                font-size: 12px;
                line-height: 1.35;
                color: #999;
                background: #0a0a0a;
                border: 1px solid #2a2a2a;
                white-space: pre-wrap;
                word-break: break-word;
                user-select: text;
                cursor: text;
                pointer-events: auto;
            }

            #errOverlay {
                position: fixed;
                left: 50%;
                top: 12px;
                transform: translateX(-50%);
                z-index: 50;
                max-width: min(92vw, 720px);
                display: none;
                background: #1a0000;
                border: 1px solid #a33;
                color: #ffd7d7;
                font-size: 12px;
                padding: 8px 12px;
                border-radius: 6px;
                white-space: pre-wrap;
            }

            #errOverlay.on {
                display: block;
            }

            #canvas:fullscreen {
                max-width: none;
                max-height: none;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            #canvas:-webkit-full-screen {
                max-width: none;
                max-height: none;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
        </style>
    </head>

    <body>
        <div id="errOverlay" role="alert"></div>

        <div id="stage">
            <canvas id="canvas" width="1920" height="1080"></canvas>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <div id="loadPct">LOADING 0%</div>
        </div>

        <div id="console"></div>

        <script>
            var consoleEl = document.getElementById("console");

            var loadingEl = document.getElementById("loading");
            var loadPctEl = document.getElementById("loadPct");

            function gdHideLoading() {
                if (!loadingEl || loadingEl.classList.contains("hide")) return;

                loadingEl.classList.add("hide");

                setTimeout(function () {
                    loadingEl.style.display = "none";
                }, 500);
            }

            try {
                Error.stackTraceLimit = 400;
            } catch (e) {}

            var GD_DEBUG = /[?&]debug(=|&|$)/.test(location.search);

            if (!GD_DEBUG) {
                try {
                    console.log = console.info = console.debug = function () {};
                } catch (e) {}

                consoleEl.style.display = "none";
            }

            var logQueue = [];
            var logScheduled = false;

            window.gdLogRaw = [];

            var GD_LOG_DOM_MAX = 4000;

            window.gdLogDump = function () {
                return window.gdLogRaw.join("\n");
            };

            function flushLog() {
                logScheduled = false;

                if (!logQueue.length) return;

                var frag = document.createDocumentFragment();

                for (var i = 0; i < logQueue.length; i++) {
                    var line = document.createElement("div");

                    line.textContent = logQueue[i];

                    frag.appendChild(line);
                }

                logQueue = [];

                var nearBottom = consoleEl.scrollHeight - consoleEl.scrollTop - consoleEl.clientHeight < 40;

                consoleEl.appendChild(frag);

                while (consoleEl.childNodes.length > GD_LOG_DOM_MAX) consoleEl.removeChild(consoleEl.firstChild);

                if (nearBottom) consoleEl.scrollTop = consoleEl.scrollHeight;
            }

            var seenDep = Object.create(null);

            var QUIET = [
                "[perf]",
                "[frame]",
                "[webgl]",
                "[io]",
                "[tex]",
                "[pngc]",
                "[pngd]",
                "[fmtf]",
                "[sink]",
                "[htb]",
                "[disp]",
                "[rawin]",
                "[touch]",
                "[cte]",
                "[list]",
                "[drs]",
                "[tex2]",
            ];

            function isQuiet(str) {
                for (var i = 0; i < QUIET.length; i++) if (str.lastIndexOf(QUIET[i], 0) === 0) return true;

                return false;
            }

            function say(s) {
                if (!GD_DEBUG) return;

                var str = String(s);

                if (!isQuiet(str)) console.log(s);

                if (
                    str.indexOf("dependency: ") === 0 ||
                    str.indexOf("still waiting on run dependencies") === 0 ||
                    str === "(end of list)"
                ) {
                    if (seenDep[str]) return;

                    seenDep[str] = 1;
                }

                window.gdLogRaw.push(str);

                if (window.gdLogRaw.length > 400000) window.gdLogRaw.splice(0, 100000);

                logQueue.push(str);

                if (!logScheduled) {
                    logScheduled = true;

                    requestAnimationFrame(flushLog);
                }
            }

            var gdProg = 0;
            var gdProgDone = false;

            var gdAssetDone = {
                wasm: false,
                data: false,
            };

            var gdAssetsFell = false;

            function gdFmtSize(n) {
                if (!n) return "0 MB";

                if (n < 1048576) return Math.round(n / 1024) + " KB";

                return (n / 1048576).toFixed(1) + " MB";
            }

            var GD_SIZE_HINT = {
                wasm: 70192990,
                data: 314500859,
            };

            var GD_BUILD_ID = "a6f253af4d4bd0a4";

            var GD_ASSET_CACHE = "gdwasm-assets";

            try {
                if (window.caches) caches.delete(GD_ASSET_CACHE).catch(function () {});
            } catch (e) {}

            var GD_SPLIT_COUNTS = {
                wasm: 4,
                data: 15,
            };

            function gdLoadSplitFile(which, onProgress) {
                var base = which === "wasm" ? "gd_web.wasm" : "gd_web.data";

                var count = GD_SPLIT_COUNTS[which];

                var chunks = [];
                var loaded = 0;

                function loadPart(i) {
                    if (i > count) {
                        var total = 0;

                        for (var x = 0; x < chunks.length; x++) total += chunks[x].byteLength;

                        var combined = new Uint8Array(total);

                        var offset = 0;

                        for (var y = 0; y < chunks.length; y++) {
                            combined.set(chunks[y], offset);

                            offset += chunks[y].byteLength;
                        }

                        return combined.buffer;
                    }

                    var url = base + ".part" + String(i).padStart(3, "0");

                    say("[" + which + "] loading " + url);

                    return fetch(url, { cache: "no-store" })
                        .then(function (r) {
                            if (!r.ok) throw new Error(url + " HTTP " + r.status);

                            return r.arrayBuffer();
                        })
                        .then(function (buf) {
                            var chunk = new Uint8Array(buf);

                            chunks.push(chunk);

                            loaded += chunk.byteLength;

                            if (onProgress) onProgress(loaded, GD_SIZE_HINT[which]);

                            return loadPart(i + 1);
                        });
                }

                return loadPart(1);
            }

            function gdInstallSplitFetch() {
                var nativeFetch = window.fetch.bind(window);

                window.fetch = function (input, init) {
                    var u = typeof input === "string" ? input : (input && input.url) || "";

                    var clean = u.split("?")[0].split("#")[0];

                    if (clean === "gd_web.data" || clean.endsWith("/gd_web.data")) {
                        return gdLoadSplitFile("data", function (loaded, total) {
                            try {
                                setAssetBar("data", loaded, total);
                            } catch (e) {}
                        }).then(function (ab) {
                            return new Response(ab, {
                                status: 200,
                                headers: {
                                    "Content-Type": "application/octet-stream",
                                    "Content-Length": String(ab.byteLength),
                                },
                            });
                        });
                    }

                    return nativeFetch(input, init);
                };
            }

            gdInstallSplitFetch();

            function gdClearCache() {
                if (!confirm("Clear saved progress and login on this site?\n" + "The game reloads afterwards.")) return;

                try {
                    if (Module && Module._gd_autosave_set) Module._gd_autosave_set(0);
                } catch (e) {}

                var jobs = [];

                if (window.caches) jobs.push(caches.delete(GD_ASSET_CACHE));

                jobs.push(
                    new Promise(function (res) {
                        try {
                            var r = indexedDB.deleteDatabase("gdwasm_saves");

                            r.onsuccess =
                                r.onerror =
                                r.onblocked =
                                    function () {
                                        res();
                                    };
                        } catch (e) {
                            res();
                        }
                    })
                );

                try {
                    localStorage.removeItem("gdWasmSize");
                    localStorage.removeItem("gdDataSize");
                } catch (e) {}

                Promise.all(jobs).then(
                    function () {
                        location.reload();
                    },
                    function () {
                        location.reload();
                    }
                );
            }

            function gdSizeHint(which) {
                return which === "wasm" ? GD_SIZE_HINT.wasm : GD_SIZE_HINT.data;
            }

            function gdLearnedSize(which) {
                try {
                    return Number(localStorage.getItem(which === "wasm" ? "gdWasmSize" : "gdDataSize")) || 0;
                } catch (e) {
                    return 0;
                }
            }

            function setAssetBar(which, loaded, total) {
                var name = which === "wasm" ? "WASM" : "DATA";

                var learned = gdLearnedSize(which);

                var hint = gdSizeHint(which);

                var known = hint > 0 ? hint : learned > 0 ? learned : total > 0 ? total : 0;

                if (known > 0 && loaded >= known) {
                    gdAssetDone[which] = true;

                    try {
                        localStorage.setItem(
                            which === "wasm" ? "gdWasmSize" : "gdDataSize",
                            String(Math.max(loaded, known))
                        );
                    } catch (e) {}
                }
            }

            function forceAssetsDone() {
                gdAssetDone.wasm = true;
                gdAssetDone.data = true;
            }

            function setProgress(p, exact) {
                if (gdProgDone && p < 100) return;

                p = Math.max(0, Math.min(100, p));

                if (p < gdProg && !exact) return;

                gdProg = p;

                if (loadPctEl) loadPctEl.textContent = "LOADING " + p.toFixed(0) + "%";

                if (p >= 100) {
                    gdProgDone = true;
                }
            }

            /* Watch the WASM frame counter. As soon as the game renders its
               first real frame, fade out the loading overlay. This is a very
               cheap rAF loop that stops once a frame has been seen. */
            (function watchFirstFrame() {
                function tick() {
                    if (!window.__gdRuntimeReady) {
                        requestAnimationFrame(tick);
                        return;
                    }

                    var n = 0;

                    try {
                        if (Module._gd_frames_get) n = Module._gd_frames_get() | 0;
                    } catch (e) {}

                    if (n > 0) {
                        window.__gdGotFrame = true;

                        setProgress(100);

                        gdHideLoading();

                        return;
                    }

                    requestAnimationFrame(tick);
                }

                requestAnimationFrame(tick);
            })();

            window.gdFirstFrame = function () {
                forceAssetsDone();
                setProgress(100);
                gdHideLoading();
            };

            var gdSaveTimer = null;
            var gdLastSave = 0;

            function scheduleSave(now) {
                if (!window.__gdRuntimeReady) return;

                if (gdSaveTimer) clearTimeout(gdSaveTimer);

                gdSaveTimer = setTimeout(
                    function () {
                        gdSaveTimer = null;

                        if (!now && Date.now() - gdLastSave < 180000) return;

                        gdLastSave = Date.now();

                        try {
                            if (Module._gd_request_save) Module._gd_request_save();
                        } catch (e) {}
                    },
                    now ? 0 : 4000
                );
            }

            document.addEventListener("visibilitychange", function () {
                if (document.hidden) scheduleSave(true);
            });

            function dumpTrace() {
                if (!window.__gdRuntimeReady) {
                    say("runtime not initialized; no trace");
                    return;
                }

                try {
                    if (!Module._gd_trace_count) {
                        say("no trace exports");
                        return;
                    }

                    var n = Module._gd_trace_count();
                    var m = Math.min(48, n);
                    var out = [];

                    for (var i = 0; i < m; i++) {
                        var va = Module._gd_trace_at(i);

                        if (typeof va === "bigint") va = Number(va & 0xffffffffn);
                        else va = va >>> 0;

                        out.push("0x" + va.toString(16));
                    }

                    say("TRACE total=" + n + " newest-first: " + out.join(" "));
                } catch (e) {
                    say("trace dump failed: " + e);
                }
            }

            function dumpRegs() {
                if (!window.__gdRuntimeReady) return;

                try {
                    if (!Module._gd_reg) {
                        say("no register export");
                        return;
                    }

                    var names = [
                        "RAX",
                        "RCX",
                        "RDX",
                        "RBX",
                        "RSP",
                        "RBP",
                        "RSI",
                        "RDI",
                        "R8",
                        "R9",
                        "R10",
                        "R11",
                        "R12",
                        "R13",
                        "R14",
                        "R15",
                    ];

                    var out = [];

                    for (var i = 0; i < names.length; i++) {
                        var v = Module._gd_reg(i);

                        var hex =
                            typeof v === "bigint"
                                ? (v & 0xffffffffffffffffn).toString(16).padStart(16, "0")
                                : (v >>> 0).toString(16).padStart(8, "0");

                        out.push(names[i] + "=0x" + hex);
                    }

                    say("REGS " + out.join(" "));

                    if (Module._gd_where) {
                        var w = Module._gd_where();

                        say(
                            "WHERE va=0x" +
                                (typeof w === "bigint" ? (w & 0xffffffffn).toString(16) : (w >>> 0).toString(16))
                        );
                    }
                } catch (e) {
                    say("register dump failed: " + e);
                }
            }

            function gdErrStack(what, e, reason) {
                var msg = what + (reason || "");

                if (e && e.stack) msg += "\n" + e.stack;
                else if (reason && reason.stack) msg += "\n" + reason.stack;

                say(msg);

                dumpRegs();
                dumpTrace();
            }

            window.addEventListener("error", function (e) {
                gdErrStack("ERROR: ", e.error, e.message);
            });

            window.addEventListener("unhandledrejection", function (e) {
                gdErrStack("REJECT: ", e.reason, e.reason);
            });

            function restoreSaves(then) {
                var called = false;

                function finish() {
                    if (!called) {
                        called = true;
                        then();
                    }
                }

                setTimeout(finish, 3000);

                try {
                    var req = indexedDB.open("gdwasm_saves", 1);

                    req.onupgradeneeded = function () {
                        req.result.createObjectStore("files");
                    };

                    req.onerror = function () {
                        say("[persist] idb open failed");

                        finish();
                    };

                    req.onsuccess = function () {
                        var store, keysReq;

                        try {
                            store = req.result.transaction("files", "readonly").objectStore("files");

                            keysReq = store.getAllKeys();
                        } catch (e) {
                            finish();
                            return;
                        }

                        keysReq.onerror = finish;

                        keysReq.onsuccess = function () {
                            var keys = keysReq.result || [];

                            say(
                                "[persist] restore: " +
                                    keys.length +
                                    " file(s) in DB" +
                                    (keys.length ? ": " + keys.join(", ") : "")
                            );

                            if (!keys.length) {
                                finish();
                                return;
                            }

                            var pending = keys.length;

                            function one() {
                                if (--pending === 0) finish();
                            }

                            keys.forEach(function (k) {
                                var g = store.get(k);

                                g.onerror = one;

                                g.onsuccess = function () {
                                    try {
                                        if (g.result && g.result.byteLength) {
                                            var s = String(k);

                                            var base = s.indexOf("AppData/") === 0 ? "/" : "/Resources/";

                                            var parts = s.split("/");
                                            var cur = base.replace(/\/$/, "");

                                            for (var pi = 0; pi < parts.length - 1; pi++) {
                                                cur += "/" + parts[pi];

                                                try {
                                                    Module.FS.stat(cur);
                                                } catch (e2) {
                                                    Module.FS.mkdir(cur);
                                                }
                                            }

                                            Module.FS.writeFile(base + s, new Uint8Array(g.result));

                                            say("[persist] restored " + s + " (" + g.result.byteLength + " bytes)");
                                        }
                                    } catch (e) {
                                        say("[persist] restore " + k + ": " + e);
                                    }

                                    one();
                                };
                            });
                        };
                    };
                } catch (e) {
                    finish();
                }
            }

            var Module = {
                canvas: document.getElementById("canvas"),

                gdInputQueue: [],

                gdCursorPos: [0, 0],

                locateFile: function (p) {
                    return p;
                },

                get dataFileDownloads() {
                    return this.__dfd;
                },

                set dataFileDownloads(v) {
                    if (this.__dfd === v) return;

                    this.__dfd = new Proxy(v || {}, {
                        set: function (t, k, val) {
                            t[k] = val;

                            try {
                                var which = /wasm/i.test(k) ? "wasm" : /\.data/i.test(k) ? "data" : null;

                                if (which) setAssetBar(which, (val && val.loaded) || 0, (val && val.total) || 0);
                            } catch (e) {}

                            return true;
                        },
                    });
                },

                instantiateWasm: function (imports, success) {
                    gdLoadSplitFile("wasm", function (loaded, total) {
                        Module.dataFileDownloads = Module.dataFileDownloads || {};

                        Module.dataFileDownloads["gd_web.wasm"] = {
                            loaded: loaded,
                            total: total,
                        };

                        setAssetBar("wasm", loaded, total);
                    })
                        .then(function (ab) {
                            try {
                                localStorage.setItem("gdWasmSize", String(ab.byteLength));
                            } catch (e) {}

                            setAssetBar("wasm", ab.byteLength, GD_SIZE_HINT.wasm);

                            gdAssetDone.wasm = true;

                            return WebAssembly.instantiate(ab, imports);
                        })
                        .then(function (r) {
                            success(r.instance, r.module);
                        })
                        .catch(function (e) {
                            say("[wasm] split load failed: " + e);

                            gdHideLoading();

                            var ov = document.getElementById("errOverlay");

                            if (ov) {
                                ov.textContent = "Failed to load WASM parts: " + e;

                                ov.classList.add("on");
                            }
                        });

                    return {};
                },

                print: function (s) {
                    say(s);
                },

                printErr: function (s) {
                    say(s);
                },

                setStatus: function (t) {
                    if (!t) return;

                    var m = /\((\d+)\/(\d+)\)/.exec(t);

                    if (m) {
                        var total = +m[2] || 1;

                        setProgress((+m[1] / total) * 78);
                    } else if (t.indexOf("Downloading") === 0) {
                        setProgress(4);
                    } else if (t.indexOf("Running") === 0) {
                        forceAssetsDone();
                        setProgress(80);
                    } else if (t.indexOf("Compiling") === 0) {
                        setProgress(76);
                    }
                },

                onRuntimeInitialized: function () {
                    window.__gdRuntimeReady = true;

                    if (!GD_DEBUG && Module._gd_log_set) Module._gd_log_set(0);

                    if (/[?&]noauto/.test(location.search) && Module._gd_autosave_set) Module._gd_autosave_set(0);

                    setProgress(82);

                    try {
                        Module.FS.chdir("/Resources");
                    } catch (e) {
                        say("FS.chdir failed: " + e);
                    }

                    setTimeout(function () {
                        restoreSaves(function () {
                            setProgress(88);

                            try {
                                const r = Module._gd_boot();

                                setProgress(92);

                                if (r && typeof r.then === "function") {
                                    r.then(function () {
                                        say("gd_boot resolved");

                                        setProgress(100);
                                    }).catch(function (e) {
                                        gdHideLoading();

                                        try {
                                            var ov = document.getElementById("errOverlay");

                                            if (ov) {
                                                ov.textContent =
                                                    "The game crashed (" +
                                                    e +
                                                    "). Reload the page to keep playing. Open it with ?debug to see logs.";

                                                ov.classList.add("on");
                                            }
                                        } catch (e2) {}

                                        say("gd_boot rejected: " + e);

                                        if (e && e.stack) say("STACK: " + e.stack);

                                        dumpTrace();
                                    });
                                } else {
                                    say("gd_boot returned (sync)");

                                    setProgress(100);
                                }
                            } catch (e) {
                                say("gd_boot exception: " + e);

                                gdHideLoading();
                            }
                        });
                    }, 100);
                },
            };

            var started = false;

            function gdStart() {
                if (started) return;

                started = true;

                window.__gdLoadStarted = true;

                setProgress(0, true);

                setTimeout(function () {
                    window.__gdInputReady = true;

                    if (window.__gdAckFocus) window.__gdAckFocus();
                }, 100);

                function loadModule() {
                    fetch("gd_web.js", { cache: "no-store" })
                        .then(function (r) {
                            if (!r.ok) throw new Error("HTTP " + r.status);

                            return r.text();
                        })
                        .then(function (code) {
                            var s = document.createElement("script");

                            s.textContent = code;

                            document.body.appendChild(s);
                        })
                        .catch(function (e) {
                            say("failed to load gd_web.js: " + e);

                            forceAssetsDone();

                            gdHideLoading();
                        });
                }

                loadModule();
            }

            /* === AUTO-START === */
            (function autoStartGame() {
                if (document.readyState === "loading") {
                    document.addEventListener(
                        "DOMContentLoaded",
                        function () {
                            gdStart();
                        },
                        { once: true }
                    );
                } else {
                    gdStart();
                }
            })();

            /* Fallback keyboard trigger (harmless once started). */
            document.addEventListener("keydown", function (e) {
                if (!started && (e.code === "Space" || e.code === "Enter" || e.code === "NumpadEnter")) {
                    e.preventDefault();

                    gdStart();
                }
            });
        </script>

        <script>
            (function () {
                const el = document.getElementById("canvas");

                const WM_MOUSEMOVE = 0x200,
                    WM_LBUTTONDOWN = 0x201,
                    WM_LBUTTONUP = 0x202,
                    WM_RBUTTONDOWN = 0x204,
                    WM_RBUTTONUP = 0x205,
                    WM_MBUTTONDOWN = 0x207,
                    WM_MBUTTONUP = 0x208;

                function ready() {
                    return window.__gdInputReady === true;
                }
